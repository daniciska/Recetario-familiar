# Publicación en Netlify: página estática, sin compilación.
[build]
  # Este comando reemplaza al que Netlify adivinó en su panel ("hugo"): no hay nada que compilar.
  command = "echo 'Sitio estático: no hay nada que compilar'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/recetas/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
