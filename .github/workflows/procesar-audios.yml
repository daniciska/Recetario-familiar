# Cada vez que alguien sube un audio a audios_nuevos/, este proceso lo transcribe,
# lo convierte en receta y lo publica. Se puede lanzar también a mano desde la
# pestaña "Actions" de GitHub ("Run workflow").
name: Procesar audios de recetas

on:
  push:
    paths:
      - "audios_nuevos/**"
  workflow_dispatch:
    inputs:
      adaptar_pendientes:
        description: "Volver a intentar adaptar las recetas pendientes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: procesar-audios
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: herramientas/requirements.txt

      - name: Guardar el modelo de transcripción entre ejecuciones
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - run: pip install -r herramientas/requirements.txt

      - name: Transcribir y adaptar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.adaptar_pendientes }}" = "true" ]; then
            python herramientas/procesar.py --adaptar
          else
            python herramientas/procesar.py
          fi

      - name: Guardar las recetas nuevas
        run: |
          git config user.name "Recetario familiar"
          git config user.email "recetario@users.noreply.github.com"
          git add -A recetas audios_nuevos
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Nuevas recetas desde audios"
            git push
          fi
