# Sitio de Netlify independiente del recetario (proyecto "calendario-familiar-pared").
# Si se conecta el repositorio en el panel, "Base directory" = calendario.
# Exportación estática (output: "export" en next.config.ts): se publica la carpeta out/.
[build]
  command = "npm run build"
  publish = "out"
  # Con el repositorio conectado, sólo se vuelve a publicar si cambió algo dentro de calendario/
  # (los audios y recetas del recetario no lo gatillan). Sin publicación previa, siempre publica.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

# Es un panel privado de la familia: que no aparezca en buscadores.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Para "Agregar a pantalla de inicio" / "Instalar app".
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
